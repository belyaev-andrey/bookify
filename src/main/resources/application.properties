spring.application.name=bookify

server.port=8080

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.contexts=prod
spring.docker.compose.skip.in-tests=true

spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none

bookify.maximum.books.borrowed=5
bookify.overdue.days=14

# mock (default, no external calls) or production (calls bookify.payments.production.base-url)
# override via env var BOOKIFY_PAYMENTS_PROVIDER
bookify.payments.provider=mock

spring.liquibase.enabled=true
