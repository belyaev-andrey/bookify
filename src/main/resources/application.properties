spring.application.name=bookify

server.port=8080

spring.flyway.locations=classpath:db/migration

bookify.maximum.books.borrowed=5
bookify.overdue.days=14

# mock (default, no external calls) or production (calls bookify.payments.production.base-url)
# override via env var BOOKIFY_PAYMENTS_PROVIDER
bookify.payments.provider=mock

spring.flyway.enabled=true

spring.cache.type=caffeine
spring.cache.cache-names=books,allBooks,members,allMembers,activeMembers
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=10m
