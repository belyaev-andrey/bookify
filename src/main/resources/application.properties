spring.application.name=bookify

server.port=8080

spring.flyway.locations=classpath:db/migration

bookify.maximum.books.borrowed=5
bookify.overdue.days=14

# mock (default, no external calls) or production (calls bookify.payments.production.base-url)
# override via env var BOOKIFY_PAYMENTS_PROVIDER
bookify.payments.provider=mock

spring.flyway.enabled=true